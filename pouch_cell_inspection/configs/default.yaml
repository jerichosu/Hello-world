# 软包电池电芯缺陷检测 - 默认配置文件

# 数据集配置
data: data/pouch_cell
data_format: yolo  # yolo 或 coco

# 类别配置
num_classes: 11
class_names:
  - normal
  - scratch
  - dent
  - stain
  - wrinkle
  - bubble
  - poor_sealing
  - leakage
  - foreign_object
  - tab_misalignment
  - deformation

# 模型配置
model:
  type: yolov8
  pretrained: yolov8m.pt
  backbone: cspdarknet

# 训练配置
train:
  epochs: 100
  batch_size: 16
  image_size: 640
  optimizer: adamw
  lr: 0.001
  lr_scheduler: cosine
  warmup_epochs: 5
  weight_decay: 0.0005
  
  # 数据增强
  augment:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.0

# 验证配置
val:
  batch_size: 32
  image_size: 640
  iou_threshold: 0.5
  confidence_threshold: 0.001

# 设备配置
device: cuda  # cuda, cpu, 或具体设备如 cuda:0
workers: 4

# 保存配置
save_dir: runs/train
project_name: pouch_cell_inspection
experiment_name: exp_001

# 推理配置
inference:
  confidence_threshold: 0.5
  iou_threshold: 0.5
  max_det: 300
  
# 导出配置
export:
  formats:
    - onnx
    - torchscript
  opset: 12
  simplify: true
